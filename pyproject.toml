[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatly-backend"
version = "0.1.0"
description = "Reference Python backend with modular architecture, gRPC, Kafka, UoW, outbox and observability"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "grpcio>=1.60,<2.0",
    "grpcio-tools>=1.60,<2.0",
    "protobuf>=4.25,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.setuptools.packages.find]
where = [
    "libs/common/src",
    "services/booking/src",
    "services/payments/src",
]
include = [
    "seatly_common*",
    "seatly_booking*",
    "seatly_payments*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "libs/common/src",
    "services/booking/src",
    "services/payments/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "N",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "generated",
]

[[tool.mypy.overrides]]
module = [
    "grpc.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
